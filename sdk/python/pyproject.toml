[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pneuma-sdk"
version = "0.1.0"
description = "Python SDK for the Pneuma REST API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Pneuma" }
]
dependencies = [
    "requests>=2.28.0"
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pneuma_sdk*"]
